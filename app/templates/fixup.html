<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Tiles Backup</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body {
        font-family: 'Inter', sans-serif;
        background-color: #1a1a1a;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .container {
        background-color: #2a2a2a;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        max-width: 500px;
        width: 100%;
        text-align: center;
    }
    h1 {
        margin-top: 0;
        font-size: 24px;
        margin-bottom: 20px;
    }
    .flashes {
        list-style: none;
        padding: 0;
        margin-bottom: 20px;
    }
    .flashes li {
        background-color: #444;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 10px;
        color: #4caf50;
    }
    input[type="file"] {
        display: block;
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        background: #111;
        border: 1px solid #444;
        border-radius: 6px;
        color: #fff;
    }
    button {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    button:hover {
        background-color: #45a049;
    }
    a.back-link {
        display: inline-block;
        margin-top: 20px;
        color: #aaa;
        text-decoration: none;
    }
    a.back-link:hover {
        color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Restore Tiles Backup</h1>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post" enctype="multipart/form-data">
      <label for="backup_zip" style="display: block; text-align: left; margin-bottom: 8px;">Upload .zip containing tiles (z*/x-y.png):</label>
      <input type="file" name="backup_zip" id="backup_zip" accept=".zip" required>
      <button type="submit">Upload & Restore</button>
    </form>
    
    <a href="/" class="back-link">&larr; Back to Canvas</a>
  </div>
</body>
</html>
