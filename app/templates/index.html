<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="toolbar">
      <img src="static/images/acedraw.png" alt="Ace Draw Logo" class="brand-logo">

      <div class="tool-group">
        <label class="tool-label">Tool</label>
        <button id="penTool" class="tool-btn active"><img src="static/images/pencil.png" alt="" class="tool-icon"> Pen</button>
        <button id="eraserTool" class="tool-btn"><img src="static/images/eraser.png" alt="" class="tool-icon"> Eraser</button>
        <button id="fillTool" class="tool-btn"><img src="static/images/fill.png" alt="" class="tool-icon"> Fill</button>
        <button id="lineTool" class="tool-btn"><img src="static/images/line.png" alt="" class="tool-icon"> Line</button>
        <button id="squareTool" class="tool-btn"><img src="static/images/square.png" alt="" class="tool-icon"> Square</button>
      </div>

      <div class="tool-group">
        <label class="tool-label" for="penColor">Pen Color</label>
        <input id="penColor" type="color" value="#111111">
      </div>

      <div class="tool-group">
        <label class="tool-label" for="brushSize">Brush Size</label>
        <input id="brushSize" type="range" min="1" max="120" value="16">
        <div id="brushSizeLabel" class="value-label">16 px</div>
      </div>

      <div class="tool-group">
        <label class="tool-label" for="zoomLevel">Zoom Level</label>
        <input id="zoomLevel" type="range" min="0" max="{{ max_zoom }}" value="2" step="0.1">
        <div id="zoomLabel" class="value-label">Layer 2.0</div>
      </div>

      <div class="tool-group">
        <button id="clearButton" class="tool-btn clear">Clear All</button>
      </div>

    </aside>

    <main class="canvas-wrap">
      <canvas id="drawCanvas"></canvas>
    </main>
  </div>

  <script>
    window.ACEDRAW_CONFIG = {
      tileSize: {{ tile_size }},
      maxZoom: {{ max_zoom }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
