services:
  app:
    build: .
    container_name: acedraw-app
    depends_on:
      - db
    environment:
      APP_NAME: AceDraw
      TILE_SIZE: 512
      MAX_ZOOM: 20
      MAX_DESCENDANT_DEPTH: 2
      TILE_ROOT: /app/data/tiles
      DATABASE_URL: postgresql://acedraw:acedraw@db:5432/acedraw
    ports:
      - "5000:5000"
    volumes:
      - ./tiles:/app/data/tiles

  db:
    image: postgres:16-alpine
    container_name: acedraw-db
    environment:
      POSTGRES_DB: acedraw
      POSTGRES_USER: acedraw
      POSTGRES_PASSWORD: acedraw
    volumes:
      - acedraw_db:/var/lib/postgresql/data

volumes:
  acedraw_db:
