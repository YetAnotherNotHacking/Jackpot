services:
  app:
    build: .
    container_name: acedraw-app
    depends_on:
      - db
      - redis
    environment:
      APP_NAME: AceDraw
      TILE_SIZE: 512
      MAX_ZOOM: 10
      MAX_PROPAGATION_DEPTH: 4
      TILE_ROOT: /app/data/tiles
      DATABASE_URL: postgresql://acedraw:acedraw@db:5432/acedraw
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - ./tiles:/app/data/tiles

  db:
    image: postgres:16-alpine
    container_name: acedraw-db
    environment:
      POSTGRES_DB: acedraw
      POSTGRES_USER: acedraw
      POSTGRES_PASSWORD: acedraw
    volumes:
      - acedraw_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: acedraw-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  acedraw_db:
